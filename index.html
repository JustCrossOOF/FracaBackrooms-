<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FracaBackrooms Multiplayer</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;font-family:sans-serif;}
canvas{display:block;width:100%;height:100%;image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
#ui {
  position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 8px;
}
button { background: #d4ac0d; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; color: #fff; cursor: pointer; font-size: 11px; }

/* Botón de Disparo Táctil Flotante */
#shoot-btn {
  position: absolute; bottom: 25px; right: 25px; z-index: 10;
  width: 65px; height: 65px; background: #c0392b; border-radius: 50%;
  border: 3px solid #fff; color: white; font-size: 24px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none;
}

/* Editor Modal */
#editor-modal {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,10,0.95); padding: 15px; border-radius: 8px; border: 2px solid #d4ac0d;
  display: none; z-index: 20; text-align: center; color: white;
  max-width: 90vw; box-sizing: border-box;
}
.pixel-grid { display: grid; grid-template-columns: repeat(8, 28px); gap: 2px; margin: 10px auto; justify-content: center; }
.pixel-cell { width: 28px; height: 28px; background: #222; border: 1px solid #444; cursor: pointer; }
.palette { display: flex; gap: 4px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.color-btn { width: 22px; height: 22px; border: 2px solid #fff; border-radius: 3px; cursor: pointer; }
.eraser-btn { background: #555; color: #fff; border: 2px dashed #fff; }
</style>
</head>
<body>
<div id="ui">
  <button onclick="toggleEditor()">🎨 Avatar</button>
</div>

<!-- Botón de Disparo -->
<div id="shoot-btn" onclick="triggerShoot()">💥</div>

<!-- Panel Editor 8x8 con Borrador -->
<div id="editor-modal">
  <h3 style="margin:5px 0 10px 0; font-size: 14px;">Diseña tu Avatar (8x8)</h3>
  <div class="pixel-grid" id="pixelGrid"></div>
  <div class="palette" id="paletteBox">
    <div class="color-btn eraser-btn" onclick="selectEraser()" title="Borrar Píxel">🧹</div>
  </div>
  <br>
  <button onclick="saveAvatar()">Guardar</button>
  <button onclick="toggleEditor()" style="background:#555; margin-left: 5px;">Cerrar</button>
</div>

<canvas id="c"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
'use strict';

var T = 16;      
var HALF = 4;    
var SPEED = 64;  

function hash(a, b) {
  var n = (a * 73856093) ^ (b * 19349663);
  n = ((n ^ (n >>> 15)) * 2654435) | 0;
  n = n ^ (n >>> 13);
  return n >>> 0;
}

function door(r, m) {
  if (r === 0) return false;
  if (r < 3) return !(m === 3 || m === 4);
  return !(m >= 2 && m <= 5);
}
function wall(tx, ty) {
  var mx = tx & 7, my = ty & 7, bx = tx >> 3, by = ty >> 3;
  if (mx === 0) { if (my === 0) return true; return door(hash(bx, by) % 5, my); }
  if (my === 0) return door(hash(bx + 977, by) % 5, mx);
  if (mx >= 2 && mx <= 6 && my >= 2 && my <= 6 && mx !== 3 && mx !== 4 && my !== 3 && my !== 4) {
    return hash(tx, ty) % 4 === 0;
  }
  return false;
}
function hit(x, y) {
  return wall(Math.floor((x - HALF) / T), Math.floor((y - HALF) / T)) ||
         wall(Math.floor((x + HALF) / T), Math.floor((y - HALF) / T)) ||
         wall(Math.floor((x - HALF) / T), Math.floor((y + HALF) / T)) ||
         wall(Math.floor((x + HALF) / T), Math.floor((y + HALF) / T));
}

var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 160, H = 144, S = 3;
var vignette = null;
var me = { x: 64, y: 64, c: 0, fx: 1, fy: 0, w: 0, a: '' };
var myId = 0, spawned = false, colors = ['#e63946'];
var others = {}, weapons = {}, monster = { x: 328, y: 328 }, bullets = [], nOthers = 0;
var input = { active: false, x: 0, y: 0, k: { l: 0, r: 0, u: 0, d: 0 } };
var hint = 6;

var myAvatarStr = "0033330003333330331331333333333333222233032222300200002020000002";
var selectedPaletteIndex = '3'; // Color actual ('0' es borrar)

function resize() {
  var iw = window.innerWidth, ih = window.innerHeight;
  S = Math.max(2, Math.round(Math.min(iw, ih) / 150));
  W = Math.ceil(iw / S); H = Math.ceil(ih / S);
  cv.width = W; cv.height = H;
  vignette = document.createElement('canvas');
  vignette.width = W; vignette.height = H;
  var g = vignette.getContext('2d');
  var r = Math.sqrt(W * W + H * H) / 2;
  var gr = g.createRadialGradient(W / 2, H / 2, r * 0.1, W / 2, H / 2, r * 0.72);
  gr.addColorStop(0, 'rgba(12,9,0,0)');
  gr.addColorStop(1, 'rgba(12,9,0,0.92)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize, false);
resize();

/* ---------- Editor de Píxeles 8x8 con Borrador ---------- */
function buildEditor() {
  var grid = document.getElementById('pixelGrid');
  grid.innerHTML = '';
  for (var i = 0; i < 64; i++) {
    var cell = document.createElement('div');
    cell.className = 'pixel-cell';
    var char = myAvatarStr[i];
    cell.style.backgroundColor = char === '0' ? 'transparent' : (colors[parseInt(char, 16)] || '#fff');
    
    (function(idx, cl) {
      cl.addEventListener('click', function() {
        var arr = myAvatarStr.split('');
        arr[idx] = selectedPaletteIndex;
        myAvatarStr = arr.join('');
        cl.style.backgroundColor = selectedPaletteIndex === '0' ? 'transparent' : colors[parseInt(selectedPaletteIndex, 16)];
      });
    })(i, cell);
    grid.appendChild(cell);
  }

  var paletteBox = document.getElementById('paletteBox');
  // Mantener el botón de borrar y añadir los de color de la red
  paletteBox.innerHTML = '<div class="color-btn eraser-btn" onclick="selectEraser()" title="Borrar Píxel">🧹</div>';
  colors.forEach(function(col, idx) {
    if (idx === 0) return;
    var btn = document.createElement('div');
    btn.className = 'color-btn';
    btn.style.backgroundColor = col;
    (function(cIdx) {
      btn.addEventListener('click', function() {
        selectedPaletteIndex = cIdx.toString(16);
      });
    })(idx);
    paletteBox.appendChild(btn);
  });
}

window.selectEraser = function() {
  selectedPaletteIndex = '0';
};

window.toggleEditor = function() {
  var modal = document.getElementById('editor-modal');
  modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
};

window.saveAvatar = function() {
  if (sock && sock.connected) sock.emit('av', myAvatarStr);
  toggleEditor();
};

/* ---------- Controles ---------- */
function setPt(x, y) { input.active = true; input.x = x; input.y = y; hint = 0; }
cv.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.touches[0]; setPt(t.clientX, t.clientY); }, false);
cv.addEventListener('touchmove', function (e) { e.preventDefault(); var t = e.touches[0]; setPt(t.clientX, t.clientY); }, false);
cv.addEventListener('touchend', function (e) { e.preventDefault(); if (!e.touches.length) input.active = false; }, false);
cv.addEventListener('mousedown', function (e) { setPt(e.clientX, e.clientY); }, false);
window.addEventListener('mousemove', function (e) { if (input.active) setPt(e.clientX, e.clientY); }, false);
window.addEventListener('mouseup', function () { input.active = false; }, false);

window.triggerShoot = function() {
  if (me.w > 0 && sock && sock.connected) {
    sock.emit('shoot', { x: me.x, y: me.y, fx: me.fx, fy: me.fy });
    // Feedback visual de bala local
    bullets.push({ x: me.x, y: me.y, dx: me.fx * 180, dy: me.fy * 180, life: 0.4 });
  }
};

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space') { triggerShoot(); e.preventDefault(); }
  var k = e.keyCode, K = input.k;
  if (k === 37 || k === 65) K.l = v=1; else if (k === 39 || k === 68) K.r = 1;
  else if (k === 38 || k === 87) K.u = 1; else if (k === 40 || k === 83) K.d = 1;
}, false);
window.addEventListener('keyup', function (e) {
  var k = e.keyCode, K = input.k;
  if (k === 37 || k === 65) K.l = 0; else if (k === 39 || k === 68) K.r = 0;
  else if (k === 38 || k === 87) K.u = 0; else if (k === 40 || k === 83) K.d = 0;
}, false);

/* ---------- Red ---------- */
var sock = null;
function addOther(id, x, y, c, w, a) {
  if (id === myId) return;
  if (!others[id]) nOthers++;
  others[id] = { x: x, y: y, dx: x, dy: y, c: c, w: w || 0, a: a || '', fx: 1, fy: 0 };
}
if (typeof io !== 'undefined') {
  sock = io({ transports: ['websocket', 'polling'], reconnectionDelay: 500 });
  sock.on('init', function (d) {
    myId = d.id; colors = d.colors; others = {}; nOthers = 0;
    monster.x = d.m[0]; monster.y = d.m[1];
    for (var i = 0; i < d.list.length; i += 6) {
      if (d.list[i] === myId) {
        me.c = d.list[i + 3]; me.w = d.list[i + 4]; me.a = d.list[i + 5];
        if (!spawned) { me.x = d.list[i + 1]; me.y = d.list[i + 2]; spawned = true; }
      } else {
        addOther(d.list[i], d.list[i + 1], d.list[i + 2], d.list[i + 3], d.list[i + 4], d.list[i + 5]);
      }
    }
    weapons = {};
    if (d.wl) { for (var j = 0; j < d.wl.length; j++) { var w = d.wl[j]; weapons[w[0]] = { t: w[1], x: w[2], y: w[3] }; } }
    buildEditor();
  });

  sock.on('j', function (d) { addOther(d[0], d[1], d[2], d[3], d[4], d[5]); });
  sock.on('l', function (id) { if (others[id]) { delete others[id]; nOthers--; } });
  
  sock.on('p', function (a, mx, my) {
    monster.x = mx; monster.y = my;
    if (a) {
      for (var i = 0; i < a.length; i += 3) {
        var o = others[a[i]];
        if (o) { o.x = a[i + 1]; o.y = a[i + 2]; }
      }
    }
  });

  sock.on('w+', function (w) { weapons[w[0]] = { t: w[1], x: w[2], y: w[3] }; });
  sock.on('w-', function (id) { delete weapons[id]; });
  sock.on('pw', function (data) {
    if (data[0] === myId) {
      me.w = data[1];
      document.getElementById('shoot-btn').style.display = me.w > 0 ? 'flex' : 'none';
    } else if (others[data[0]]) {
      others[data[0]].w = data[1];
    }
  });
  sock.on('av', function (data) { if (others[data[0]]) others[data[0]].a = data[1]; });
  sock.on('fix', function (p) { me.x = p[0]; me.y = p[1]; });

  var lx = 0, ly = 0;
  setInterval(function () {
    var x = Math.round(me.x), y = Math.round(me.y);
    if (sock.connected && myId && (x !== lx || y !== ly)) { lx = x; ly = y; sock.emit('m', [x, y]); }
  }, 100);
}

/* ---------- Lógica ---------- */
function update(dt) {
  var vx = 0, vy = 0, K = input.k;
  if (input.active) {
    var dx = input.x - window.innerWidth / 2, dy = input.y - window.innerHeight / 2;
    var d = Math.sqrt(dx * dx + dy * dy), dead = 10 * S / 3;
    if (d > dead) { var m = Math.min(1, (d - dead) / (40 * S / 3)); vx = dx / d * m; vy = dy / d * m; }
  } else {
    vx = K.r - K.l; vy = K.d - K.u;
    if (vx && vy) { vx *= 0.7071; vy *= 0.7071; }
  }
  if (vx || vy) {
    var nx = me.x + vx * SPEED * dt, ny = me.y + vy * SPEED * dt;
    if (!hit(nx, me.y)) me.x = nx;
    if (!hit(me.x, ny)) me.y = ny;
    if (Math.abs(vx) > Math.abs(vy)) { me.fx = vx > 0 ? 1 : -1; me.fy = 0; } else { me.fx = 0; me.fy = vy > 0 ? 1 : -1; }
  }

  // Actualizar balas locales
  for (var i = bullets.length - 1; i >= 0; i--) {
    var b = bullets[i];
    b.x += b.dx * dt; b.y += b.dy * dt;
    b.life -= dt;
    if (b.life <= 0) bullets.splice(i, 1);
  }

  for (var id in others) { var o = others[id]; o.dx += (o.x - o.dx) * 0.25; o.dy += (o.y - o.dy) * 0.25; }
  if (hint > 0) hint -= dt;
}

/* ---------- Dibujo de Sprites Nítidos (Pixel Perfect) ---------- */
function drawPixelAvatar(x, y, avatarStr, colorIdx) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = 'rgba(0,0,0,0.35);'; ctx.fillRect(x - 5, y + 3, 10, 4);
  let startX = x - 4, startY = y - 4;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      let idx = r * 8 + c;
      let char = avatarStr ? avatarStr[idx] : '0';
      if (char && char !== '0') {
        let colCode = parseInt(char, 16);
        ctx.fillStyle = colors[colCode] || colors[colorIdx % colors.length] || '#fff';
        ctx.fillRect(startX + c, startY + r, 1, 1);
      }
    }
  }
}

// Dibujar pistola nítida y alineada con la dirección del jugador
function drawGun(x, y, fx, fy) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = '#bdc3c7'; // Cañón de metal limpio
  if (fx !== 0) {
    ctx.fillRect(x + (fx > 0 ? 4 : -7), y, 4, 2);
    ctx.fillStyle = '#7f8c8d'; // Empuñadura
    ctx.fillRect(x + (fx > 0 ? 5 : -5), y + 2, 1, 2);
  } else {
    ctx.fillRect(x, y + (fy > 0 ? 4 : -7), 2, 4);
  }
}

function draw(now) {
  var cx = Math.round(me.x - W / 2), cy = Math.round(me.y - H / 2);
  var tx0 = Math.floor(cx / T), ty0 = Math.floor(cy / T);
  var tx1 = tx0 + Math.ceil(W / T) + 1, ty1 = ty0 + Math.ceil(H / T) + 1;
  var bad = (Math.floor(now / 90) % 23) === 0;
  var tx, ty, sx, sy, n;

  for (ty = ty0; ty <= ty1; ty++) {
    for (tx = tx0; tx <= tx1; tx++) {
      sx = tx * T - cx; sy = ty * T - cy;
      if (wall(tx, ty)) {
        ctx.fillStyle = '#c9b655'; ctx.fillRect(sx, sy, T, T);
        ctx.fillStyle = '#b8a548'; ctx.fillRect(sx + 3, sy, 1, T); ctx.fillRect(sx + 11, sy, 1, T);
        if (!wall(tx, ty - 1)) { ctx.fillStyle = '#e3d47c'; ctx.fillRect(sx, sy, T, 1); }
        if (!wall(tx, ty + 1)) { ctx.fillStyle = '#8f7f35'; ctx.fillRect(sx, sy + T - 6, T, 6); ctx.fillStyle = '#6e6128'; ctx.fillRect(sx, sy + T - 1, T, 1); }
      } else {
        var mx = tx & 7, my = ty & 7;
        var lit = (mx === 3 || mx === 4) && (my === 3 || my === 4) && !(bad && hash(tx >> 3, ty >> 3) % 3 === 0);
        ctx.fillStyle = lit ? '#b9a965' : '#a8985a'; ctx.fillRect(sx, sy, T, T);
        n = hash(tx, ty);
        if ((n & 7) === 0) { ctx.fillStyle = '#968748'; ctx.fillRect(sx + ((n >>> 4) & 7) * 2, sy + ((n >>> 8) & 7) * 2, 2, 1); }
      }
    }
  }

  // Armas en suelo (nítidas)
  for (var wid in weapons) {
    var w = weapons[wid];
    var wx = w.x - cx, wy = w.y - cy;
    ctx.fillStyle = w.t === 2 ? '#e74c3c' : '#f1c40f';
    ctx.fillRect(wx - 3, wy - 3, 6, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(wx - 1, wy - 1, 2, 2);
  }

  // Balas
  ctx.fillStyle = '#ff0';
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    ctx.fillRect(b.x - cx, b.y - cy, 2, 2);
  }

  // Monstruo
  var mx_draw = monster.x - cx, my_draw = monster.y - cy;
  ctx.fillStyle = '#8b0000';
  ctx.beginPath(); ctx.arc(mx_draw, my_draw, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff0';
  ctx.fillRect(mx_draw - 2, my_draw - 2, 1, 1);
  ctx.fillRect(mx_draw + 1, my_draw - 2, 1, 1);

  // Otros jugadores
  for (var id in others) {
    var o = others[id];
    drawPixelAvatar(o.dx - cx, o.dy - cy, o.a, o.c);
    if (o.w > 0) drawGun(o.dx - cx, o.dy - cy, o.fx, o.fy);
  }

  // Yo
  drawPixelAvatar(me.x - cx, me.y - cy, myAvatarStr, me.c);
  if (me.w > 0) drawGun(me.x - cx, me.y - cy, me.fx, me.fy);

  ctx.drawImage(vignette, 0, 0);
  ctx.font = '8px monospace'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#e3d47c'; ctx.fillText((nOthers + 1) + (nOthers ? ' aquí' : ' aquí (solo/a)'), 3, 3);
  if (hint > 0) { ctx.textAlign = 'center'; ctx.fillText('toca para moverte | 💥 botón para disparar', W / 2, H - 12); ctx.textAlign = 'left'; }
}

var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(f, 33); };
var last = Date.now();
function loop() {
  raf(loop);
  var now = Date.now(), dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || dt > 0.05) dt = 0.05;
  update(dt); draw(now);
}
loop();
})();
</script>
</body>
</html>
